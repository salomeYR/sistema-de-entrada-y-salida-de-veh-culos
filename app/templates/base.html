<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autos Colombia</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    nav { background: #1e3a5f; padding: 12px 20px; }
    nav a { color: #fff; margin-right: 18px; text-decoration: none; font-weight: bold; }
    main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    input, select, textarea { padding: 8px; margin: 6px 0 14px; width: 100%; box-sizing: border-box; }
    button { background: #1e3a5f; color: #fff; border: 0; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eef1f5; }
    .ok { background: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .error { background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    .cards { display: flex; gap: 16px; }
    .card { flex: 1; background: #eef1f5; padding: 20px; border-radius: 8px; text-align: center; font-size: 28px; }
    .card small { display: block; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('registro.index') }}">Inicio</a>
    <a href="{{ url_for('registro.entrada') }}">Entrada</a>
    <a href="{{ url_for('registro.salida') }}">Salida</a>
    <a href="{{ url_for('registro.dentro') }}">Vehículos dentro</a>
    <a href="{{ url_for('registro.novedad') }}">Novedades</a>
    <a href="{{ url_for('registro.historial') }}">Historial</a>
  </nav>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="{{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
